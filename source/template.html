<title>Toronto Talk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column like a transit card; progress, streaks and blanks are drawn as subway lines with stations. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#13202b; --muted:#586876; --rule:#d6dee5;
  --accent:#d42a1d; --accent-ink:#ffffff; --accent-soft:#fbe5e2;
  --ok:#1b7a4b; --ok-soft:#e1f2e8; --warn:#9a5c00; --warn-soft:#fbefd9; --bad:#b4261b; --bad-soft:#fbe3e0;
  --l-talk:#00923f; --l-feel:#c2307a; --l-food:#d96400; --l-travel:#0072bc; --l-errand:#8a5a2b;
  --l-biz:#8f2a8a; --l-email:#00838f; --l-phrasal:#b58900; --l-idiom:#d42a1d; --l-color:#2e7d6b; --l-taste:#b8486a;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e161d; --surface:#16212b; --ink:#e7edf2; --muted:#94a4b2; --rule:#283844;
  --accent:#ff5b4c; --accent-ink:#1a0c0a; --accent-soft:#3a1d1a;
  --ok:#53c78f; --ok-soft:#173326; --warn:#f0a640; --warn-soft:#3a2b14; --bad:#ff7a6e; --bad-soft:#3a1c19;
  --l-talk:#33b76a; --l-feel:#f06aa8; --l-food:#ff9a3d; --l-travel:#4aa8f0; --l-errand:#c99062;
  --l-biz:#cf62c9; --l-email:#35c0c9; --l-phrasal:#f4c62a; --l-idiom:#ff5b4c; --l-color:#5fc9ae; --l-taste:#f07fa0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161d; --surface:#16212b; --ink:#e7edf2; --muted:#94a4b2; --rule:#283844;
  --accent:#ff5b4c; --accent-ink:#1a0c0a; --accent-soft:#3a1d1a;
  --ok:#53c78f; --ok-soft:#173326; --warn:#f0a640; --warn-soft:#3a2b14; --bad:#ff7a6e; --bad-soft:#3a1c19;
  --l-talk:#33b76a; --l-feel:#f06aa8; --l-food:#ff9a3d; --l-travel:#4aa8f0; --l-errand:#c99062;
  --l-biz:#cf62c9; --l-email:#35c0c9; --l-phrasal:#f4c62a; --l-idiom:#ff5b4c; --l-color:#5fc9ae; --l-taste:#f07fa0; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.logo{color:inherit;text-decoration:none;cursor:pointer;border-radius:6px}
.logo:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:rgba(5,10,15,.55)}
.modal-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal-card h2{margin:0;font-size:1.05rem}
.modal-card p{margin:0;font-size:.9rem;color:var(--muted)}
.modal-card .row{justify-content:flex-end}
.brand h1{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:2rem;line-height:1;letter-spacing:-.01em;margin:0;text-transform:uppercase}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:var(--muted);font-size:.85rem}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);margin-top:2px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block}
.sync.on i{background:var(--ok)}
body.quizzing{padding-block:8px 48px}
body.quizzing .brand p,body.quizzing .sync{display:none}
body.quizzing .brand h1{font-size:1.35rem}
body.quizzing .wrap{gap:12px}
body.quizzing #card{gap:10px;padding-block:16px}
.msg:empty{display:none}
#fb:empty{display:none}
.streak-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--rule);font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.streak-badge i{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);display:inline-block}
.streak-badge.on i{border-color:var(--accent);background:var(--accent)}
.streak-badge.pending i{border-color:var(--accent);background:var(--surface)}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--rule);border-radius:12px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:600;font-size:.9rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}

.panel{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.label{font-family:var(--display);font-stretch:90%;font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:10px;background:var(--bg);min-width:0}
.stat b{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.stat b small{font-size:.9rem;color:var(--muted);font-weight:700}
.stat span{font-size:.8rem;color:var(--muted)}
.stat.hot b{color:var(--accent)}

.lines{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);font-size:.85rem}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.chip[aria-pressed="false"]{opacity:.5}
.chip[aria-pressed="false"] .dot{background:transparent!important;border:2px solid var(--muted)}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{padding:14px 20px;font-size:1.05rem;width:100%;justify-content:center}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 10px}
.btn.small{padding:6px 10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
select,.search{font:inherit;font-size:.92rem;padding:8px 10px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);min-width:0}
.search{flex:1 1 200px}
.small{font-size:.85rem;color:var(--muted);margin:0}

.review-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.review-list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--rule);font-size:.92rem}
.review-list li:first-child{border-top:0}
.review-list .en{font-weight:600;min-width:0;overflow-wrap:anywhere}
.review-list .ko{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.when{flex:none;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);align-self:flex-start;white-space:nowrap}
.when.again{background:var(--warn-soft);color:var(--warn)}

/* subway-line progress */
.track{position:relative;display:flex;justify-content:space-between;align-items:center;height:22px;margin:0 6px}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:var(--rule);border-radius:2px}
.track .fill{position:absolute;left:0;top:50%;height:4px;margin-top:-2px;background:var(--accent);border-radius:2px;transition:width .3s}
.stn{position:relative;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--rule);flex:none}
.stn.done{border-color:var(--accent);background:var(--accent)}
.stn.now{width:18px;height:18px;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
.trackmeta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}

.qcat{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted)}
.tag.retry{background:var(--warn-soft);color:var(--warn)}
.sentence-mode .slots.focused .slot.active .blank::after{display:none}
.said{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:10px;background:var(--bg);cursor:text}
.tries{list-style:none;margin:0 0 6px;padding:0 0 8px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:4px}
.tries li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:.8rem;color:var(--muted)}
.tries li b{font-weight:700;color:var(--muted)}
.tries li span{overflow-wrap:anywhere;text-decoration:line-through;text-decoration-color:var(--bad)}
.tries li em{font-style:normal;font-variant-numeric:tabular-nums}
.said-label{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.said-text{font-size:1rem;line-height:1.6;overflow-wrap:anywhere}
.said-text.muted{color:var(--muted);font-size:.88rem}
.said-label b.good{color:var(--ok)} .said-label b.bad{color:var(--bad)}
.said-chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:2px}
.tk{display:inline-flex;align-items:baseline;gap:4px;padding:3px 8px;border-radius:6px;font-size:.98rem;line-height:1.35;border:1px solid transparent}
.tk small{font-size:.78rem;font-weight:600;color:var(--ink);opacity:.75}
.tk.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.tk.sub{background:var(--bad-soft);color:var(--bad);border-color:var(--bad);font-weight:600}
.tk.miss{background:transparent;color:var(--muted);border:1.5px dashed var(--muted)}
.tk.extra{background:transparent;color:var(--muted);text-decoration:line-through;border-color:var(--rule)}
.tk.key{box-shadow:inset 0 -3px 0 var(--accent)}
.tk.miss.key{border-color:var(--accent);color:var(--accent);font-weight:700}
.said-legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;padding-top:8px;border-top:1px solid var(--rule)}
.said-legend .tk{font-size:.72rem;padding:1px 6px}
.lg-key{font-size:.72rem;color:var(--muted);text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.btn.mode-toggle{padding:4px 8px;font-size:.8rem;border:1px solid var(--rule)}
.btn.mode-toggle[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.mic-btn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:7px 14px 7px 11px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:.88rem;cursor:pointer}
.mic-btn svg{color:var(--accent);width:17px;height:17px}
.mic-btn.on{border-color:var(--accent);color:var(--accent)}
.mic-btn.on::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);animation:micdot 1s ease-in-out infinite}
.mic-btn.on svg{display:none}
@keyframes micdot{50%{opacity:.25}}
.set-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:center}
.set-grid>label{font-size:.88rem;color:var(--muted);white-space:nowrap}
.set-grid select{width:100%}
.set-voice{display:flex;gap:8px;min-width:0}
.set-voice select{flex:1}
.set-voice .btn{flex:none;color:var(--accent)}
.voice-tip{font-size:.78rem;color:var(--muted);margin:0}
.app-foot{text-align:center;font-size:.75rem;color:var(--muted);margin:4px 0 0}
.linkish{font:inherit;color:inherit;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.qright{display:flex;align-items:center;gap:6px}
.btn.listen{padding:4px 8px;font-size:.8rem}
.ko-line{font-size:1.15rem;font-weight:600;line-height:1.55;margin:0;text-wrap:balance}
.en-line{font-size:1.2rem;line-height:2.1;margin:0;overflow-wrap:anywhere}
/* 빈칸 = 두 역 사이의 선로: 얇은 2px 선 양 끝에 작은 역 점 */
.slot{--slot:var(--muted);position:relative;display:inline-block;margin:0 6px;vertical-align:baseline;max-width:100%}
.slot::before,.slot::after{content:"";position:absolute;bottom:-2px;width:7px;height:7px;border-radius:50%;background:var(--surface);border:2px solid var(--slot);box-sizing:border-box;transition:border-color .2s,background .2s}
.slot::before{left:-5px}.slot::after{right:-5px}
.blank{display:inline-block;font:600 1.1rem/1.3 var(--mono);color:var(--ink);border-bottom:2px solid var(--slot);padding:2px 6px 3px;max-width:100%;text-align:center;white-space:pre;min-height:1.75em;transition:border-color .2s;box-sizing:border-box}
.blank.ph{color:var(--warn);opacity:.7}
.slots{display:inline-flex;flex-wrap:wrap;align-items:baseline;max-width:100%;vertical-align:baseline;cursor:text}
.slots.focused .slot{--slot:var(--accent)}
.slots.focused .slot::before,.slots.focused .slot::after{background:var(--slot)}
.slots.focused .slot.active .blank::after{content:"";display:inline-block;width:2px;height:1.05em;margin-left:1px;vertical-align:-.15em;background:var(--accent);animation:caret 1s steps(1) infinite}
.slots.focused .slot.active .blank.ph::after{margin-left:-2px}
@keyframes caret{50%{opacity:0}}
/* 실제 입력칸: 16px 이상이어야 iOS가 확대하지 않아요. 보이지 않게 칸 위에 겹쳐 둬요 */
/* 실제 입력칸은 카드 아래 빈 공간에 숨겨 둬요. iOS 받아쓰기 막대가 입력칸 근처에 뜨기 때문에,
   이렇게 하면 막대가 문장이나 결과를 가리지 않아요. 터치는 막고(pointer-events) 빈칸·문장 상자를 누르면 포커스를 줘요. */
/* 실제 입력칸은 화면 맨 위(제목 자리)에 겹쳐 숨겨 둬요.
   iOS는 입력칸이 보이도록 스크롤하고, 받아쓰기 막대도 입력칸 근처에 띄우기 때문에
   맨 위에 두면 화면이 아래로 끌려 내려가지 않고 막대도 문제 카드를 가리지 않아요. */
.input-dock{position:relative;height:0;margin-bottom:-12px}
.answer-input{position:absolute;left:0;top:-44px;width:60%;height:24px;pointer-events:none;opacity:0;font-size:18px;border:0;padding:0;margin:0;background:transparent;color:transparent;caret-color:transparent;-webkit-appearance:none;appearance:none;z-index:1}
.answer-input::-webkit-search-cancel-button,.answer-input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.slot.ok{--slot:var(--ok)!important} .slot.ok .blank{color:var(--ok)}
.slot.wrong,.slot.revealed{--slot:var(--bad)!important} .slot.wrong .blank,.slot.revealed .blank{color:var(--bad)}
.slot.ok::before,.slot.ok::after,.slot.revealed::before,.slot.revealed::after{background:var(--slot)}
.slots.shake .slot{animation:shake .35s}
.sep{font:600 1.15rem var(--mono);color:var(--muted);margin:0 -1px}
.sep.space{display:inline-block;width:.15em}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.hint{font:600 1.05rem var(--mono);letter-spacing:.18em;color:var(--warn);margin:0;overflow-wrap:anywhere}
.hint small{font-family:var(--body);letter-spacing:0;font-weight:500;font-size:.8rem;color:var(--muted);margin-right:8px}
.msg{font-size:.88rem;color:var(--bad);margin:0;min-height:1.3em}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn.primary{margin-left:auto}

.feedback{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.feedback.clean{background:var(--ok-soft)}
.feedback.hinted{background:var(--warn-soft)}
.feedback.revealed{background:var(--bad-soft)}
.feedback h3{margin:0;font-size:1rem}
.bonus{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;background:var(--surface);border:1px dashed var(--rule)}
.bonus p{margin:0;font-size:.9rem}
.bonus .hint{font-size:1rem}
.bonus-title{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--accent);font-size:.88rem!important}
.star{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);display:inline-block}
.star.on{background:var(--accent)}
.bonus-msg{color:var(--bad);font-size:.84rem!important}
.bonus-msg:empty{display:none}
.slot.bonus-slot{--slot:var(--accent)}
.slot.bonus-done{--slot:var(--muted)!important}
.alt-note{font-size:.88rem!important;padding:8px 10px;border-radius:8px;background:var(--surface)}
.alt-note b{color:var(--ink)}
.measure{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82rem!important;color:var(--muted);font-variant-numeric:tabular-nums}
.pill.g-perfect{background:var(--ok);color:var(--surface)}
.pill.g-good{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.pill.g-hard{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.pill.g-hinted{background:var(--warn-soft);color:var(--warn)}
.pill.g-revealed{background:var(--bad-soft);color:var(--bad)}
.rules{display:flex;flex-direction:column}
.rules div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--rule);font-size:.86rem}
.rules div:first-child{border-top:0}
.rules span:nth-child(2){color:var(--muted)}
.rules b{font-weight:600;text-align:right}
.wnote .measure{display:flex;margin-bottom:6px}
.fb-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn.next{padding:8px 14px 8px 16px;font-size:.92rem;flex:none}
.btn.next svg{margin-right:-2px}
.feedback.clean h3{color:var(--ok)} .feedback.hinted h3{color:var(--warn)} .feedback.revealed h3{color:var(--bad)}
.feedback p{margin:0;font-size:.93rem}
.feedback .full{font-weight:600}

.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem}
kbd{font:500 .75rem var(--mono);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}
.keys{font-size:.78rem;color:var(--muted);margin:0}

/* 단어장 */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.84rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.seg button .n{font-weight:500;opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
.words{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.words li{border-top:1px solid var(--rule)}
.words li:first-child{border-top:0}
.words details{padding:12px 0}
.words summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.words summary::-webkit-details-marker{display:none}
.wmeta{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted);flex-wrap:wrap}
.wmeta .sp{margin-left:auto}
.went{font-size:1rem;font-weight:500;overflow-wrap:anywhere}
.went b{font-weight:700;color:var(--ink);background:linear-gradient(transparent 62%,var(--accent-soft) 62%);padding:0 2px}
.wko{font-size:.86rem;color:var(--muted)}
.wnote{margin:10px 0 0;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:.88rem;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pill{font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill.again{background:var(--warn-soft);color:var(--warn)}
.pill.learning{background:var(--bg);color:var(--muted);border:1px solid var(--rule)}
.pill.mastered{background:var(--ok-soft);color:var(--ok)}
.empty{padding:24px 8px;text-align:center;color:var(--muted);font-size:.92rem;margin:0}

/* 대시보드 */
.big-streak{display:flex;align-items:baseline;gap:8px}
.big-streak b{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:3.6rem;line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums}
.big-streak span{font-weight:600}
.streak-line{position:relative;display:flex;justify-content:space-between;align-items:center;height:20px;margin:4px 5px 0}
.streak-line::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:var(--rule)}
.streak-line .seg-on{position:absolute;top:50%;height:3px;margin-top:-1.5px;background:var(--accent)}
.sday{position:relative;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--rule);flex:none}
.sday.on{border-color:var(--accent);background:var(--accent)}
.sday.today{width:15px;height:15px;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sday.today.on{background:var(--accent)}
.axis{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:3px;height:96px;border-bottom:1px solid var(--rule);position:relative}
.bars .b{flex:1;min-width:0;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.bars .b.zero{background:var(--rule)}
.bars .b.today{background:var(--ink)}
.bars .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--rule);font-size:.68rem;color:var(--muted);line-height:1;padding-top:2px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--rule)}
.stack span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:.84rem}
.legend div{display:flex;align-items:center;gap:8px;min-width:0}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.lprog{display:flex;flex-direction:column;gap:12px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:.88rem;align-items:center}
.lrow .nm{display:flex;align-items:center;gap:8px;min-width:0}
.lrow .ct{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.8rem}
.lbar{grid-column:1/-1;position:relative;height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.lbar span{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.lbar .seen{opacity:.35}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{display:flex;flex-direction:column;gap:2px;padding:8px 2px;border-radius:8px;background:var(--bg);min-width:0}
.week b{font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums;line-height:1.1}
.week span{font-size:.7rem;color:var(--muted)}
.week div.hot b{color:var(--accent)}

@media (max-width:420px){.stat b{font-size:1.5rem}.brand h1{font-size:1.7rem}.keys{display:none}.big-streak b{font-size:3rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
// 빌드 대상: false = Claude 아티팩트, true = 직접 호스팅(GitHub Pages)
const HOSTED=/*@@HOSTED@@*/false;
const BUILD=/*@@BUILD@@*/"dev";
/* ---------- 노선(카테고리) ---------- */
const LINES = {
  talk:   {name:"일상 회화",     color:"var(--l-talk)"},
  feel:   {name:"감정·관계",     color:"var(--l-feel)"},
  food:   {name:"식당·쇼핑",     color:"var(--l-food)"},
  travel: {name:"여행·교통",     color:"var(--l-travel)"},
  errand: {name:"집·병원·은행",  color:"var(--l-errand)"},
  biz:    {name:"회의·업무",     color:"var(--l-biz)"},
  email:  {name:"이메일·메신저", color:"var(--l-email)"},
  phrasal:{name:"구동사",        color:"var(--l-phrasal)"},
  idiom:  {name:"관용구",        color:"var(--l-idiom)"},
  color:  {name:"색·꽃·자연",    color:"var(--l-color)"},
  taste:  {name:"맛·질감",       color:"var(--l-taste)"}
};
// [id, line, 영어(___ = 빈칸), 정답, 한국어 해석, 설명, 대체 정답]
const RAW = /*@@CARDS@@*/;
const CARDS = RAW.filter(r=>LINES[r[1]]).map(([id,line,en,answer,ko,note,alts])=>({id,line,en,answer,ko,note,alts:alts||[]}));
const BY_ID = Object.fromEntries(CARDS.map(c=>[c.id,c]));

/* ---------- 날짜 ---------- */
function dayKey(d=new Date()){const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function addDays(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return dayKey(d)}
function dayDiff(key){const [y,m,d]=key.split("-").map(Number);const a=new Date(y,m-1,d,12);const b=new Date();b.setHours(12,0,0,0);return Math.round((a-b)/864e5)}
function whenLabel(key){const n=dayDiff(key);if(n<=0)return"오늘";if(n===1)return"내일";if(n===2)return"모레";const [,m,d]=key.split("-").map(Number);return m+"월 "+d+"일"}
function md(key){const [,m,d]=key.split("-").map(Number);return m+"/"+d}
const WD=["일","월","화","수","목","금","토"];
function weekday(key){const [y,m,d]=key.split("-").map(Number);return WD[new Date(y,m-1,d,12).getDay()]}
const INTERVALS=[1,1,3,7,14,30]; // 이전 버전(box) 기록을 읽을 때만 써요
function addDaysFrom(key,n){const [y,m,d]=key.split("-").map(Number);return dayKey(new Date(y,m-1,d+n,12))}
function laterLabel(key){const n=dayDiff(key);if(n<=0)return"오늘";if(n===1)return"내일";const [,m,d]=key.split("-").map(Number);return `${n}일 뒤 (${m}월 ${d}일)`}

/* ---------- 저장 (이 브라우저) ---------- */
const LS="toronto-talk-v1";
let progress={};   // cardId -> {box,due,hinted,firstSeen,last,seen,updated}
let settings={newPerDay:10,lines:Object.keys(LINES),autoSpeak:true,speechRate:0.95,answerMode:"word",voice:"",micQuiet:false,micQuietV:4};
let log=null;      // "YYYY-MM-DD" -> 그날 푼 문제 수
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||"{}");progress=j.progress||{};if(j.settings)settings=Object.assign(settings,j.settings);log=j.log||null}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({progress,settings,log}))}catch(e){}}
// 새로 생긴 노선은 기존 사용자에게도 자동으로 켜기
function normalizeSettings(){if(settings.micQuietV!==4){settings.micQuiet=false;settings.micQuietV=4}const known=settings.knownLines||[];let changed=false;for(const k of Object.keys(LINES)){if(!known.includes(k)){known.push(k);if(!settings.lines.includes(k))settings.lines.push(k);changed=true}}settings.lines=settings.lines.filter(k=>LINES[k]);if(!settings.lines.length){settings.lines=Object.keys(LINES);changed=true}settings.knownLines=known;return changed}
// 활동 기록이 없던 이전 버전 사용자는 마지막 학습일로 대략 복원
function ensureLog(){if(log)return false;log={};for(const s of Object.values(progress)){const k=s.last||s.firstSeen;if(k)log[k]=(log[k]||0)+1}return true}
function setState(id,st){st.updated=Date.now();progress[id]=st;saveLocal();markDirty("p_"+BY_ID[id].line)}
function saveSettings(){settings.updated=Date.now();saveLocal();markDirty("meta")}

/* ---------- 계정 저장 (Claude 계정, 기기 간 동기화) ----------
   노선별 문서 9개(p_노선)에 카드 상태를, meta 문서에 설정과 날짜별 기록을 둬요. */
let col=null; const dirty=new Set(); let flushTimer=null; const chains={};
function setSync(on,text){const el=document.getElementById("sync");el.classList.toggle("on",on);el.querySelector("span").textContent=text}
function docBody(name){
  if(name==="meta")return {settings,log};
  const line=name.slice(2), cards={};
  for(const c of CARDS)if(c.line===line&&progress[c.id])cards[c.id]=progress[c.id];
  return {cards};
}
function markDirty(name){if(!col)return;dirty.add(name);clearTimeout(flushTimer);flushTimer=setTimeout(flush,1500)}
function flush(){
  if(!col)return;
  for(const name of [...dirty]){
    dirty.delete(name);
    const body=JSON.parse(JSON.stringify(docBody(name)));
    chains[name]=(chains[name]||Promise.resolve()).then(()=>col.doc(name).set(body)).then(()=>setSync(true,"계정에 저장됨")).catch(()=>{setSync(false,"계정 저장 실패 · 이 브라우저에 저장 중");dirty.add(name)});
  }
}
// 앱을 잠시 나갔다 온 시간은 풀이 시간에서 빼요
document.addEventListener("visibilitychange",()=>{
  if(!cur||cur.done)return;
  if(document.visibilityState==="hidden")cur.hiddenAt=performance.now();
  else if(cur.hiddenAt!=null){cur.paused+=performance.now()-cur.hiddenAt;cur.hiddenAt=null}
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){clearTimeout(flushTimer);flush()}});
async function connect(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user){setSync(false,"로그인하면 계정에 저장돼요");return}
    const uid=await user.id(); if(!uid){setSync(false,"로그인하면 계정에 저장돼요");return}
    const c=db.collection("data/users/"+uid);
    const snap=await c.get();
    const remote={}; snap.docs.forEach(d=>{if(d.exists)remote[d.id]=d.data()});
    const toPush=new Set();
    // 카드 상태: 더 최근에 바뀐 쪽을 사용
    const remoteCards={};
    for(const [k,v] of Object.entries(remote))if(k.startsWith("p_")&&v&&v.cards)Object.assign(remoteCards,v.cards);
    for(const [id,v] of Object.entries(remoteCards)){if(!BY_ID[id])continue;const cur=progress[id];if(!cur||(v.updated||0)>(cur.updated||0))progress[id]={...v}}
    for(const [id,v] of Object.entries(progress)){if(!BY_ID[id])continue;const r=remoteCards[id];if(!r||(v.updated||0)>(r.updated||0))toPush.add("p_"+BY_ID[id].line)}
    // 설정과 날짜별 기록
    const meta=remote.meta||{};
    if(meta.settings&&(meta.settings.updated||0)>(settings.updated||0))settings=Object.assign({},settings,meta.settings);
    const mergedLog={...(meta.log||{})};
    for(const [k,n] of Object.entries(log||{}))mergedLog[k]=Math.max(mergedLog[k]||0,n);
    const logChanged=JSON.stringify(mergedLog)!==JSON.stringify(meta.log||{});
    log=mergedLog;
    normalizeSettings();
    if(logChanged||!meta.settings||(settings.updated||0)>(meta.settings.updated||0))toPush.add("meta");
    col=c; saveLocal();
    toPush.forEach(n=>dirty.add(n)); if(dirty.size)flush();
    setSync(true,"계정에 저장됨");
    if(view!=="quiz")go(view==="done"?"study":view);
  }catch(e){setSync(false,"계정에 연결하지 못했어요 · 이 브라우저에 저장 중")}
}

/* ---------- 복습 간격 개편(v2) 1회 적용 ----------
   힌트 없이 맞혀 둔 표현의 간격을 1.75배로 늘리고, 마지막으로 푼 날 기준으로 다음 복습일을 다시 잡아요.
   계정 기록과 합친 뒤에 한 번만 실행해서, 다른 기기의 최신 기록을 덮어쓰지 않아요. */
function migrateSchedule(){
  if((settings.schedV||1)>=2)return;
  const t=dayKey(); let n=0;
  for(const [id,st] of Object.entries(progress)){
    if(!BY_ID[id]||st.hinted)continue;
    const old=cardIvl(st), ivl=Math.max(old+1,Math.round(old*1.75));
    let due=addDaysFrom(st.last||st.firstSeen||t,ivl);
    if(st.due&&due<st.due)due=st.due;
    progress[id]={...st,ivl,due,updated:Date.now()}; delete progress[id].box;
    markDirty("p_"+BY_ID[id].line); n++;
  }
  settings.schedV=2; saveSettings(); saveLocal();
  if(n&&view!=="quiz")go(view==="done"?"study":view);
}

/* ---------- 상태 계산 ---------- */
function cardIvl(s){return s.ivl!=null?s.ivl:INTERVALS[s.box||0]}
function status(id){const s=progress[id];if(!s)return"new";if(s.hinted)return"again";return cardIvl(s)>=7?"mastered":"learning"}
const STATUS={again:"다시 볼 표현",learning:"학습 중",mastered:"익힌 표현",new:"새 표현"};
function streakInfo(){
  const t=dayKey(), has=k=>(log[k]||0)>0;
  let cur=0,i=has(t)?0:1; // 오늘 아직 안 했으면 어제부터 셈
  while(has(addDays(-i-cur)))cur++;
  const days=Object.keys(log).filter(has).sort();
  let best=0,run=0,prev=null;
  for(const k of days){if(prev&&dayDiff(k)-dayDiff(prev)===1)run++;else run=1;best=Math.max(best,run);prev=k}
  return {cur,best,todayDone:has(t),total:days.length};
}
function renderBadge(){
  const s=streakInfo(), b=document.getElementById("badge");
  b.className="streak-badge "+(s.todayDone?"on":s.cur?"pending":"");
  b.querySelector("span").textContent=s.cur?`${s.cur}일 연속`:"오늘 첫 운행";
  b.title=s.todayDone?"오늘 학습 완료":s.cur?"오늘 학습하면 연속 기록이 이어져요":"오늘 학습을 시작해 보세요";
}

/* ---------- 학습 큐 ---------- */
function activeCards(){return CARDS.filter(c=>settings.lines.includes(c.line))}
function dueCards(){const t=dayKey();return activeCards().filter(c=>progress[c.id]&&progress[c.id].due<=t).sort((a,b)=>progress[a.id].due.localeCompare(progress[b.id].due))}
function newToday(){const t=dayKey();return Object.entries(progress).filter(([id,s])=>BY_ID[id]&&s.firstSeen===t).length}
function unseen(){return activeCards().filter(c=>!progress[c.id])}
function newSlots(){return Math.max(0,Math.min(settings.newPerDay-newToday(),unseen().length))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- 공통 ---------- */
let view="study", session=null;
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const norm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/\s+/g," ").trim();
const SPEAK_ICON=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
const canSpeak="speechSynthesis" in window;
// 기기에 있는 영어 음성 중 가장 자연스러운 것을 골라요 (캐나다 > 미국 > 기타 영어, 고음질 음성 우선)
let voiceCache=null;
// 효과음 같은 장난 음성(Bells, Bubbles 등)은 목록에서 빼요
const NOVELTY=/bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|fred|junior|kathy|ralph|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley/i;
const voiceKey=v=>v.name+"|"+v.lang;
function englishVoices(){
  if(!canSpeak)return [];
  const score=v=>(/en[-_]CA/i.test(v.lang)?4:/en[-_]US/i.test(v.lang)?3:1)+(/enhanced|premium|natural|neural/i.test(v.name)?3:0)+(/samantha|google|ava|allison|nathan/i.test(v.name)?1:0);
  const seen=new Map();
  for(const v of speechSynthesis.getVoices()){
    if(!/^en[-_]/i.test(v.lang)||NOVELTY.test(v.name))continue;
    const k=voiceKey(v), old=seen.get(k);
    if(!old||(v.localService&&!old.localService))seen.set(k,v);   // 같은 음성이 두 번 나오면 기기 안 음성 하나만 남겨요
  }
  return [...seen.values()].sort((a,b)=>score(b)-score(a)||a.name.localeCompare(b.name));
}
const REGION={US:"미국",CA:"캐나다",GB:"영국",AU:"호주",IE:"아일랜드",IN:"인도",ZA:"남아공",NZ:"뉴질랜드",SG:"싱가포르"};
function voiceLabel(v){
  const r=(v.lang.split(/[-_]/)[1]||"").toUpperCase();
  const q=/premium/i.test(v.name)?" · 최고 음질":/enhanced|natural|neural/i.test(v.name)?" · 고음질":"";
  return `${v.name.replace(/\s*\((enhanced|premium)\)/i,"")} (${REGION[r]||r||"영어"})${q}`;
}
function pickVoice(){
  if(settings.voice==="system")return null;            // 기기 기본 음성: iOS가 영어 기본 음성을 고르게 둬요
  const vs=englishVoices(); if(!vs.length)return null;
  if(settings.voice){const v=vs.find(x=>voiceKey(x)===settings.voice);if(v)return v}   // 직접 고른 음성
  return vs[0];                                                                        // 자동: 가장 자연스러운 음성
}
function fillVoiceSelect(){
  const sel=document.getElementById("voiceSel"); if(!sel)return;
  const vs=englishVoices();
  sel.innerHTML=`<option value="">자동 (추천 음성)</option><option value="system" ${settings.voice==="system"?"selected":""}>아이폰 기본 영어 음성</option>`+vs.map(v=>`<option value="${esc(voiceKey(v))}" ${voiceKey(v)===settings.voice?"selected":""}>${esc(voiceLabel(v))}</option>`).join("");
}
if(canSpeak){try{speechSynthesis.onvoiceschanged=()=>{voiceCache=pickVoice();fillVoiceSelect()}}catch(e){}}
function utter(text){
  const u=new SpeechSynthesisUtterance(text);
  voiceCache=settings.voice==="system"?null:(voiceCache||pickVoice());
  if(voiceCache)u.voice=voiceCache;
  u.lang=voiceCache?voiceCache.lang:(settings.voice==="system"?"en-US":"en-CA"); u.rate=settings.speechRate||0.95; u.volume=1;
  return u;
}
function speak(text){if(!canSpeak)return;try{speechSynthesis.cancel();const u=utter(text);u.onstart=()=>micLog("읽기 시작");u.onend=()=>micLog("읽기 끝");micLog("읽기 요청");speechSynthesis.speak(u)}catch(e){}}
// 빈칸이 있는 문장: 빈칸 앞을 읽고 잠깐 쉬었다가 뒤를 읽어요
let blankTimer=null;
function speakWithBlank(card){
  if(!canSpeak)return;
  micLog("듣기(빈칸 문장)");
  try{
    speechSynthesis.cancel(); clearTimeout(blankTimer);
    const [pre,post]=card.en.split("___").map(x=>x.trim());
    const second=()=>{if(post&&/[a-z0-9]/i.test(post))speechSynthesis.speak(utter(post))};
    if(pre&&/[a-z0-9]/i.test(pre)){const u=utter(pre);u.onend=()=>{blankTimer=setTimeout(second,700)};speechSynthesis.speak(u)}
    else blankTimer=setTimeout(second,300);
  }catch(e){}
}
const fullSentence=c=>c.en.replace("___",c.answer);

/* ---------- 페이지 안 마이크 (직접 호스팅한 버전에서만) ----------
   Claude 아티팩트 안에서는 마이크가 막혀 있어서, GitHub Pages처럼 직접 올린 페이지에서만 버튼을 보여 줘요.
   브라우저 음성 인식(Web Speech API)을 쓰고, 인식 후보 여러 개 중 정답과 맞는 것을 골라요. */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const canMic=HOSTED&&!!SR;
const MIC_ICON=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>`;
let rec=null, listening=false, voiceFlow=false, micEndedAt=0;
function setMicUI(){
  const b=document.getElementById("micBtn"); if(!b)return;
  b.classList.toggle("on",listening);
  b.querySelector("span").textContent=listening?(micWaiting?"준비 중":"듣는 중"):"말하기";
  if(cur&&!cur.done&&sentenceMode()&&!ansEl().value)renderSaid();
}
function micMsg(t){const m=cur&&cur.done?document.getElementById("bonusMsg"):document.getElementById("msg");if(m)m.textContent=t}
function candidateOk(t){
  const inp=ansEl(), keep=inp.value; inp.value=t;
  let ok=false;
  if(cur.done){const a=loose(cur.card.answer);ok=typedLoose()===a||spokenMatch([a])===0}
  else if(sentenceMode())ok=gradeSentence().ok;
  else{const allL=[cur.card.answer,...cur.card.alts].map(loose);ok=allL.includes(typedLoose())||spokenMatch(allL)>=0}
  inp.value=keep; return ok;
}
/* 인식을 끝낼 때는 절대 abort()를 쓰지 않아요.
   아이폰 사파리에서 abort()는 시스템 음성 인식 작업을 강제로 취소(cancel)하는데, 정답을 받은 직후처럼
   인식이 스스로 마무리되는 중에 취소하면 그 뒤로 사파리(홈 화면 앱) 전체에서 인식이 아무것도 못 듣게 돼요.
   이 상태는 페이지를 새로고침해도 풀리지 않아요. 그래서:
   - 최종 결과를 받으면 아무것도 하지 않고 인식이 스스로 끝나기(onend)를 기다려요.
   - 직접 끝내야 할 땐 stop()으로 부드럽게 끝내요.
   - 이전 인식이 끝나기 전에 다시 누르면, 끝난 걸 확인한 뒤에 새 인식을 시작해요. */
let missCount=0, pendingStart=false, afterRecEnd=null, recSeq=0;
/* 정답이 정해졌을 때: 채점은 말이 끝난 경계에서만 하니까, 여기서 인식을 닫아도 말하는 도중이 아니에요. */
function releaseListening(){
  pendingStart=false; clearTimeout(startT); micWaiting=false;
  if(rec)gracefulStop(rec);
  listening=false; setMicUI();
}
function stopListening(){
  pendingStart=false; clearTimeout(startT); micWaiting=false;
  if(rec)gracefulStop(rec);
  listening=false; setMicUI();
}
function gracefulStop(r){
  clearTimeout(r.__wd); clearTimeout(r.__pause);
  if(r.__stopping)return;
  r.__stopping=true;
  micLog(`#${r.__n} stop() 호출`);
  try{r.stop()}catch(e){}
  // 끝났다는 신호가 끝내 안 오면 이 인식은 잊어요 (abort는 하지 않아요)
  r.__forget=setTimeout(()=>recDone(r),2500);
}
function recDone(r){
  clearTimeout(r.__wd); clearTimeout(r.__forget);
  if(rec!==r)return;
  rec=null; micEndedAt=Date.now();
  if(listening&&(pendingStart||r.__retry)){pendingStart=false;startSoon(r.__retry?1:0);return}
  pendingStart=false; listening=false; setMicUI();
  runAfterRecEnd();
}
/* 아이폰은 앞선 인식이 끝난 직후 곧바로 새 인식을 시작하면 소리를 못 받아요(같은 문제에서 다시 말할 때 멈추던 원인).
   앞선 인식이 끝나고 RESTART_GAP이 지난 뒤에 시작해요. */
const RESTART_GAP=1200; let startT=null, micWaiting=false;
function startSoon(retry){
  clearTimeout(startT);
  const w=RESTART_GAP-(Date.now()-micEndedAt);
  if(w<=0){micWaiting=false;beginRec(retry);return}
  micWaiting=true; setMicUI(); micLog(`새 인식 ${w}ms 뒤 시작`);
  startT=setTimeout(()=>{micWaiting=false;if(listening&&!rec)beginRec(retry);else setMicUI()},w);
}
function runAfterRecEnd(){clearTimeout(afterRecT);const fn=afterRecEnd;afterRecEnd=null;if(fn)fn()}
// 인식이 끝난 뒤에 할 일 (예: 정답 문장 읽기). 인식 중이 아니면 바로 해요.
// 마이크가 열려 있는 동안 소리를 내면 아이폰 인식이 고장 나요. 인식이 정말 끝난(onend) 순간에 바로 읽어요.
let afterRecT=null;
function afterMic(fn){
  if(!rec){fn();return}
  afterRecEnd=fn;
}
/* 음성 인식 기록: 아이폰에서 어디서 멈추는지 보려고 이벤트를 시간과 함께 남겨요 (최근 80개) */
const MICLOG_KEY="toronto-talk-miclog";
let micLogs=[]; try{micLogs=JSON.parse(localStorage.getItem(MICLOG_KEY)||"[]")}catch(e){}
function micLog(t){
  const d=new Date(), ts=d.toTimeString().slice(0,8)+"."+String(d.getMilliseconds()).padStart(3,"0");
  micLogs.push(ts+" "+t); if(micLogs.length>80)micLogs=micLogs.slice(-80);
  try{localStorage.setItem(MICLOG_KEY,JSON.stringify(micLogs))}catch(e){}
}
function micLogText(){return `Toronto Talk 음성 인식 기록 (버전 ${BUILD})\n${navigator.userAgent}\nstandalone=${!!(navigator.standalone||matchMedia("(display-mode: standalone)").matches)}\n\n`+micLogs.join("\n")}
function copyMicLog(btn){
  const t=micLogText();
  const done=()=>{if(btn)btn.textContent="복사했어요"};
  const fallback=()=>{const a=document.createElement("textarea");a.value=t;a.setAttribute("readonly","");a.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){}a.remove()};
  try{navigator.clipboard.writeText(t).then(done,fallback)}catch(e){fallback()}
}
const RESUME_KEY="toronto-talk-resume";
// 인식이 계속 아무것도 못 들으면, 지금 위치를 저장해 두고 앱을 다시 열도록 안내해요
function showMicStuck(){
  saveResume();
  const m=cur&&cur.done?document.getElementById("bonusMsg"):document.getElementById("msg"); if(!m)return;
  m.innerHTML=`음성 인식이 소리를 받지 못하고 있어요. 사파리(또는 홈 화면 앱)를 앱 전환 화면에서 위로 밀어 완전히 닫았다가 다시 열어 주세요. 이 문제부터 이어서 풀 수 있어요. <button class="btn small" id="micLogBtn">기록 복사</button>`;
  const lb=document.getElementById("micLogBtn"); if(lb)lb.onclick=e=>{e.stopPropagation();copyMicLog(lb)};
}
function saveResume(){
  try{
    if(session&&view==="quiz"){
      // 지금 문제는 아직 안 풀었으면 처음부터, 풀었으면 다음 문제부터
      const pos=cur&&cur.done?session.pos+1:session.pos;
      localStorage.setItem(RESUME_KEY,JSON.stringify({queue:session.queue,pos,results:session.results,at:Date.now()}));
    }
  }catch(e){}
  saveLocal(); try{flush()}catch(e){}
}
function resumeSaved(){
  let d=null; try{d=JSON.parse(localStorage.getItem(RESUME_KEY)||"null");localStorage.removeItem(RESUME_KEY);sessionStorage.removeItem(RESUME_KEY)}catch(e){}
  if(!d||Date.now()-d.at>30*60*1000)return false;
  const queue=(d.queue||[]).filter(q=>BY_ID[q.id]);
  if(d.pos>=queue.length)return false;
  session={queue,pos:d.pos,results:d.results||{clean:0,hinted:0,revealed:0}};
  voiceFlow=true;
  buildQuizShell(); view="quiz"; renderQuiz();
  const m=document.getElementById("msg"); if(m)m.textContent="멈췄던 문제부터 이어서 풀어요. 말하기를 눌러 보세요.";
  return true;
}
function stopSpeech(){try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel()}catch(e){}}
function toggleListening(){
  micLog(`말하기 누름 (듣는 중=${listening}, 이전 인식=${rec?rec.__n:"없음"}, 문제 ${session?session.pos+1:"?"})`);
  // 틀린 뒤 다시 누른 건 '다시 말할게요'라는 뜻이에요. 인식은 끄지 않고 같은 인식으로 계속 들어요.
  if(listening&&rec&&rec.__awaitRetry&&!cur.done){
    rec.__awaitRetry=false; rec.__arm(IDLE_MS,false); rec.__consumed=rec.__full||rec.__consumed;
    if(sentenceMode())resetAttempt(); micMsg("다시 말해 보세요."); setMicUI(); return }
  if(listening){stopListening();return}
  if(!canMic||(cur.done&&!bonusOpen()))return;
  afterRecEnd=null; stopSpeech();
  voiceFlow=true;
  if(isBox(document.activeElement))ansEl().blur();   // 키보드는 내려요
  if(sentenceMode()&&!cur.done)resetAttempt();        // 다시 말하면 이번 문장은 새로 인식해요
  if(rec&&!rec.__stopping){listening=true;setMicUI();micMsg("");rec.__consumed="";clearTimeout(rec.__pause);rec.__arm(IDLE_MS,false);return} // 열려 있는 인식으로 계속 들어요
  listening=true; setMicUI(); micMsg("");
  // 앞선 인식이 아직 끝나는 중이면, 끝난 다음에 바로 새로 시작해요 (중간에 끊으면 아이폰 인식이 고장 나요)
  if(rec){pendingStart=true;gracefulStop(rec);return}
  startSoon(0);
}
/* 한 문제 동안은 인식 하나를 계속 열어 두고(continuous), 다시 말하기도 같은 인식으로 들어요.
   아이폰은 인식이 끝난 직후 새 인식을 시작하면 소리를 못 받아요(기록으로 확인: audiostart 뒤 아무 결과 없음).
   말 한 번이 끝난 시점은 iOS의 최종 결과, 또는 1초 동안 새 결과가 없을 때로 봐요. 그때만 채점하고,
   정답이면 그 경계에서 stop()해요 (말하는 도중에는 끊지 않아요). */
const PAUSE_MS=1000, FIRST_WAIT_MS=8000, IDLE_MS=20000;
function beginRec(retry){
  const r=new SR(); rec=r; const t0=Date.now(); r.__n=++recSeq;
  r.__consumed=""; r.__text="";
  const lg=t=>micLog(`#${r.__n} ${t} +${Date.now()-t0}ms`);
  for(const ev of ["start","audiostart","soundstart","speechstart","speechend","soundend","audioend","nomatch"])r.addEventListener(ev,()=>lg(ev));
  // 말을 시작하지 않으면 '듣는 중'에 멈춰 있지 않게 정리해요
  const arm=(ms,first)=>{clearTimeout(r.__wd);r.__wd=setTimeout(()=>{
    if(rec!==r)return;
    lg(first?"8초 동안 결과 없음 → stop":"20초 동안 말이 없음 → stop");
    gracefulStop(r); listening=false; setMicUI();
    if(first){missCount++; if(missCount>=2)showMicStuck(); else micMsg("말소리를 못 들었어요. 말하기 버튼을 다시 누르고 바로 말해 보세요.")}
    else micMsg("다시 말하려면 말하기 버튼을 눌러 주세요.");
  },ms)};
  r.__arm=arm; arm(FIRST_WAIT_MS,true);
  r.lang="en-US"; r.interimResults=true; r.continuous=true; r.maxAlternatives=5;
  r.onresult=e=>{
    const all=[...e.results], lastR=all[all.length-1];
    lg(`result${lastR.isFinal?" (최종)":""}: ${lastR[0].transcript}`);
    if(rec!==r)return;
    if(!r.__heard){r.__heard=true;missCount=0}
    const join=k=>all.map((x,i)=>x[i===all.length-1?k:0].transcript).join(" ").replace(/\s+/g," ").trim();
    // 이미 채점한 말은 빼고, 이번에 새로 한 말만 봐요 (iOS가 문장을 처음부터 다시 쓰면 그대로 써요)
    const fresh=t=>{const c=r.__consumed;return c&&t.toLowerCase().startsWith(c.toLowerCase())?t.slice(c.length).trim():t};
    const text=fresh(join(0));
    if(!text)return;
    clearTimeout(r.__pause); r.__awaitRetry=false;
    if(lastR.isFinal){
      // 첫 후보가 틀려도 다른 인식 후보 중 정답이 있으면 그걸 써요 (예: "buck"을 "book"으로 들었을 때)
      let pick=text;
      for(let i=0;i<lastR.length;i++){const c=fresh(join(i));if(c&&candidateOk(c)){pick=c;break}}
      utteranceDone(r,pick,true,join(0));
    }else{
      showHeard(text);
      r.__text=text; r.__full=join(0);
      r.__pause=setTimeout(()=>{if(rec===r)utteranceDone(r,r.__text,false,r.__full)},PAUSE_MS);
      arm(IDLE_MS,false);
    }
  };
  r.onerror=e=>{
    lg("error "+e.error+(e.message?" "+e.message:""));
    if(rec!==r)return;
    clearTimeout(r.__wd); clearTimeout(r.__pause);
    const quick=Date.now()-t0<1200;
    if(!retry&&quick&&listening&&["audio-capture","network"].includes(e.error)){ // 막 시작했는데 실패하면 끝난 뒤 한 번 더 시도해요
      r.__retry=true;
    }else if(e.error!=="aborted"||!r.__stopping){
      listening=false; setMicUI();
      if(e.error==="not-allowed"||e.error==="service-not-allowed")micMsg("마이크 권한이 꺼져 있어요. 아이폰 설정 > 앱 > Safari > 마이크에서 이 사이트를 허용해 주세요.");
      else if(e.error==="no-speech")micMsg("소리가 안 들렸어요. 버튼을 다시 누르고 말해 보세요.");
      else if(e.error!=="aborted")micMsg(`음성 인식이 잠깐 안 됐어요. 다시 눌러 보세요. (${e.error})`);
    }
    // 오류 뒤에 끝 신호가 안 올 수도 있어서, 조금 뒤 정리해요
    clearTimeout(r.__forget); r.__forget=setTimeout(()=>recDone(r),800);
  };
  r.onend=()=>{lg("end");clearTimeout(r.__pause);recDone(r)};
  lg("start() 호출");
  try{r.start()}catch(e){lg("start() 예외 "+e.name);rec=null;listening=false;setMicUI();micMsg("음성 인식을 시작하지 못했어요. 다시 눌러 보세요.")}
}
// 말하는 중에는 화면에만 보여 주고 채점하지 않아요
function showHeard(t){
  if(cur.done&&!bonusOpen())return;
  if(sentenceMode()&&!cur.done&&cur.resetNext)resetAttempt();   // 틀린 뒤 다시 말하면 새 문장으로 받아요
  ansEl().value=t;
  sentenceMode()?renderSaid():renderBoxes();
}
// 말 한 번이 끝났을 때 채점해요
function utteranceDone(r,text,final,full){
  clearTimeout(r.__pause);
  if(cur.done&&!bonusOpen()){r.__consumed=full;return}
  if(sentenceMode()&&!cur.done&&cur.resetNext)resetAttempt();
  const wasDone=cur.done, tries=(cur.attempts||[]).length;
  ansEl().value=text;
  if(cur.done){ sentenceMode()?renderSaid():renderBoxes(); checkBonus() }
  else if(sentenceMode()){ renderSaid(); checkSentence(final) }
  else{ renderBoxes(); check(true) }   // 단어 모드는 말이 멈추면 다 말한 거예요
  const judged=cur.done!==wasDone||(cur.attempts||[]).length>tries||cur.wasWrong||final;
  if(judged)r.__consumed=full;
  if(!cur.done&&rec===r)r.__awaitRetry=true;
  micLog(`#${r.__n} ${final?"최종":"1초 멈춤"} 채점: "${text}" → ${cur.done?(wasDone?"보너스 처리":"정답"):judged?"틀림, 계속 듣는 중":"아직 말하는 중"}`);
  if(cur.done&&!bonusOpen()&&rec===r){gracefulStop(r);listening=false;setMicUI()}  // 말이 끝난 경계에서만 닫아요
}

// 페이지 안 확인 창 (아티팩트에서는 confirm()이 동작하지 않아서 직접 만들어요)
function confirmBox({title,body,ok,cancel},onOk){
  const old=document.getElementById("modal"); if(old)old.remove();
  const m=document.createElement("div"); m.className="modal"; m.id="modal";
  m.innerHTML=`<div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">${esc(title)}</h2><p>${esc(body)}</p>
    <div class="row"><button class="btn" id="mCancel">${esc(cancel)}</button><button class="btn primary" id="mOk">${esc(ok)}</button></div></div>`;
  document.body.appendChild(m);
  const close=()=>{m.remove();document.removeEventListener("keydown",onKey,true)};
  const onKey=e=>{if(e.key==="Escape"){e.preventDefault();e.stopPropagation();close()}};
  document.addEventListener("keydown",onKey,true);
  m.addEventListener("click",e=>{if(e.target===m)close()});
  document.getElementById("mCancel").onclick=close;
  document.getElementById("mOk").onclick=()=>{close();onOk()};
  if(isBox(document.activeElement))ansEl().blur();
  document.getElementById("mOk").focus();
}
function leaveQuiz(){
  if(view!=="quiz"){go("study");return}
  if(listening)stopListening();
  const left=session?session.queue.length-session.pos-(cur&&cur.done?1:0):0;
  confirmBox({title:"학습을 그만둘까요?",body:`지금까지 푼 문제는 저장돼요. 남은 ${left}개는 다음에 다시 나와요.`,ok:"메인으로 나가기",cancel:"계속 풀기"},()=>go("study"));
}
document.getElementById("logo").addEventListener("click",e=>{e.preventDefault();leaveQuiz()});

function setTabs(tab){
  document.body.classList.toggle("quizzing",tab==="quiz");
  const nav=document.getElementById("tabs");
  nav.hidden=(tab==="quiz");
  nav.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));
  renderBadge();
}
function go(tab){
  if(tab==="words")renderWords();else if(tab==="stats")renderStats();else renderHome();
  try{history.replaceState(null,"","#"+tab)}catch(e){}
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab));

function startSession(extraNew){
  const due=shuffle(dueCards());
  const fresh=shuffle(unseen()).slice(0,extraNew!=null?extraNew:newSlots());
  const queue=[...due,...fresh].map(c=>({id:c.id,retry:false,isNew:!progress[c.id]}));
  if(!queue.length)return;
  session={queue,pos:0,results:{clean:0,hinted:0,revealed:0}};
  buildQuizShell(); view="quiz"; renderQuiz();
}

/* ---------- 학습 홈 ---------- */
function renderHome(){
  view="study"; setTabs("study");
  const due=dueCards().length, nw=newSlots();
  const t=dayKey(), tm=addDays(1);
  const doneToday=log[t]||0;
  const seen=CARDS.filter(c=>progress[c.id]).length;
  const tomorrow=CARDS.filter(c=>progress[c.id]&&progress[c.id].due===tm).length;
  const hinted=CARDS.filter(c=>status(c.id)==="again").sort((a,b)=>progress[a.id].due.localeCompare(progress[b.id].due));
  const total=due+nw;
  app.innerHTML=`
  <div class="wrap">
    <section class="panel">
      <p class="label">오늘의 노선</p>

/* ---------- 퀴즈 ---------- */
let cur=null;
function trackHTML(){
  const n=session.queue.length, p=session.pos;
  const pct=n>1?(p/(n-1))*100:0;
  const stations=n<=24?session.queue.map((_,i)=>`<span class="stn ${i<p?"done":i===p?"now":""}"></span>`).join(""):"";
  return `<div class="track" aria-hidden="true"><span class="fill" style="width:${n>24?(p/n*100):pct}%"></span>${stations}</div>
  <div class="trackmeta"><span>${p+1} / ${n}번째 역</span><span>종점까지 ${n-p-1}개</span></div>`;
}
// 퀴즈 화면은 세션마다 한 번만 만들고, 문제가 바뀔 땐 내용만 바꿔요.
// 첫 입력칸(#ans)은 계속 같은 요소로 남아 있어야 휴대폰 키보드가 닫히지 않고 고른 언어(영어)가 유지돼요.
// 여러 단어로 된 정답은 단어마다 입력칸을 나누고, 하이픈·아포스트로피 같은 기호는 칸 사이에 고정 글자로 보여 줘요.
const INPUT_ATTRS='type="search" lang="en" inputmode="latin" enterkeyhint="next" autocomplete="off" data-1p-ignore data-lpignore="true" data-form-type="other" autocapitalize="off" autocorrect="off" spellcheck="false"';
/* 입력칸 구조: 실제 입력칸은 #ans 하나뿐이고, 계속 포커스를 유지해요.
   보이는 단어 칸들은 #ans에 친 글자를 단어 길이대로 나눠 그린 화면이에요.
   포커스가 칸 사이를 옮겨 다니지 않으니 아이폰에서 화면이 확대되거나 키보드가 깜빡이지 않아요. */
let boxLens=[], boxEls=[], placeholderTxt="";
const ansEl=()=>document.getElementById("ans");
const isBox=el=>!!el&&el.id==="ans";
function keepFocus(el){
  el.addEventListener("pointerdown",e=>{if(isBox(document.activeElement))e.preventDefault()});
  el.addEventListener("mousedown",e=>{if(isBox(document.activeElement))e.preventDefault()});
}
function segments(ans){return ans.split(/([^A-Za-z0-9]+)/).filter(x=>x!=="").map(x=>({word:/[A-Za-z0-9]/.test(x),text:x}))}
// 친 글자를 칸마다 나눠요: 단어 길이를 채우면 다음 칸으로, 띄어쓰기·기호를 쳐도 다음 칸으로.
// 자동으로 넘어간 직후의 띄어쓰기·기호는 버리고, 마지막 칸에서는 띄어쓰기를 그대로 둬요(여러 단어 대체 정답용).
function distribute(raw){
  const out=boxLens.map(()=>""), last=boxLens.length-1; let i=0, auto=false;
  for(const ch of raw){
    if(!/[A-Za-z0-9]/.test(ch)){
      if(i<last){ if(auto||out[i]===""){auto=false;continue} i++; auto=false; continue }
      if(out[i]!=="")out[i]+=ch; continue;
    }
    auto=false; out[i]+=ch;
    if(i<last&&out[i].length>=boxLens[i]){i++;auto=true}
  }
  return {out,active:i};
}
function renderBoxes(){
  const hideTyped=sentenceMode()&&cur&&!cur.done;   // 문장 모드: 말한 내용은 아래 상자에만, 빈칸은 비워 둬요
  const {out,active}=hideTyped?{out:boxLens.map(()=>""),active:0}:distribute(ansEl().value);
  boxEls.forEach((el,i)=>{
    const t=el.querySelector(".blank");
    const ph=i===0&&!out[0]&&placeholderTxt;
    t.textContent=ph?placeholderTxt:(out[i].replace(/\s+$/," ")||"\u200b"); // 빈 칸도 글자 기준선에 맞추려고 폭 0 글자를 넣어요
    t.classList.toggle("ph",!!ph);
    el.classList.toggle("active",i===active);
  });
}
function layoutBoxes(answer){
  const wrap=document.getElementById("slotView");
  wrap.innerHTML=""; boxEls=[]; boxLens=[]; placeholderTxt="";
  const segs=segments(answer);
  for(const sg of segs){
    if(!sg.word){
      if(!boxEls.length)continue;
      const sep=document.createElement("span");
      sep.className="sep"+(sg.text.trim()?"":" space"); sep.textContent=sg.text.trim();
      wrap.appendChild(sep); continue;
    }
    const sl=document.createElement("span"); sl.className="slot";
    sl.innerHTML=`<span class="blank"></span>`;
    wrap.appendChild(sl); boxEls.push(sl); boxLens.push(sg.text.length);
  }
  boxEls.forEach((sl,i)=>{
    const w=boxLens[i];
    sl.querySelector(".blank").style.minWidth=(boxEls.length===1?Math.max(w,4)+2:Math.max(w,2)+1.6)+"ch";
  });
  const inp=ansEl(); inp.value="";
  inp.setAttribute("aria-label",boxEls.length>1?`빈칸 정답 (${boxEls.length}단어, 띄어쓰기로 다음 칸)`:"빈칸 정답");
  setSlots(""); renderBoxes();
}
function setSlots(cls){boxEls.forEach(sl=>{const a=sl.classList.contains("active");sl.className="slot"+(cls?" "+cls:"")+(a?" active":"")})}
function toggleWrong(on){boxEls.forEach(sl=>sl.classList.toggle("wrong",on))}
function shakeSlots(){const w=document.getElementById("slots");w.classList.remove("shake");void w.offsetWidth;w.classList.add("shake")}
function setPlaceholder(t){placeholderTxt=t||"";renderBoxes()}
const typedLoose=()=>loose(ansEl().value);
function fillBoxes(answer){
  const words=segments(answer).filter(x=>x.word).map(x=>x.text);
  ansEl().value=words.length===boxLens.length?words.join(" "):answer;
  cur.shown=ansEl().value; placeholderTxt=""; renderBoxes();
}
function restoreBoxes(){ansEl().value=cur.shown||"";renderBoxes()}
function wireAnswer(inp){
  inp.addEventListener("keydown",e=>{
    if(e.key!=="Enter")return;
    e.preventDefault();
    if(cur.done&&!bonusOpen()){next();return}
    if(sentenceMode()&&!cur.done){checkSentence(true);return}
    const {out,active}=distribute(inp.value);
    if(active<boxLens.length-1&&out[active]){inp.value+=" ";renderBoxes();return}
    if(cur.done){next();return}
    check(true);
  });
  // 정답 처리 후에는 입력을 막되 readOnly를 쓰지 않아 키보드가 계속 열려 있게 해요
  inp.addEventListener("beforeinput",e=>{
    if(cur&&cur.done&&!bonusOpen()&&e.inputType!=="insertLineBreak"){e.preventDefault();return}
    if(cur&&!cur.done&&cur.resetNext&&sentenceMode()&&e.inputType.startsWith("insert")){ // 틀린 뒤 다시 말하면 이전 문장은 지우고 새로 받아요
      resetAttempt();
    }
  });
  inp.addEventListener("input",()=>{
    if(cur.done&&!bonusOpen()){restoreBoxes();return}
    if(sentenceMode()){
      renderSaid();
      if(cur.done){checkBonus();return}
      clearTimeout(cur.autoT); cur.autoT=setTimeout(()=>checkSentence(false),1400); // 받아쓰기가 멈추면 자동 확인
      return;
    }
    renderBoxes();
    cur.done?checkBonus():check(false);
  });
  inp.addEventListener("focus",()=>document.getElementById("slots").classList.add("focused"));
  inp.addEventListener("blur",()=>document.getElementById("slots").classList.remove("focused"));
  // 커서는 항상 맨 끝에 (칸 화면과 어긋나지 않게)
  const toEnd=()=>{try{inp.setSelectionRange(inp.value.length,inp.value.length)}catch(e){}};
  inp.addEventListener("select",toEnd); inp.addEventListener("click",toEnd);
}

// 표기만 다른 답(캐나다/미국 철자, 줄임말, 지역 표현)은 같은 정답으로 봐요. 하이픈·띄어쓰기는 채점에서 아예 무시해요.
// 보너스 도전은 뜻이 같은 '다른 단어'로 맞혔을 때만 열려요.
const SPELLING=[["favour","favor"],["cheque","check"],["chequing","checking"],["cancelled","canceled"],["burned","burnt"],
  ["inquire","enquire"],["id","identification"],["ac","air conditioning"],["intro","introduction"],["invite","invitation"],
  ["cc'ing","ccing"],["two-four","2-4"],["line","lineup"],["in-suite","ensuite"],["statutory","stat"],["missing","missed"],
  ["drop off","drop"],["return","round-trip"],["vacation","holiday"],["ride","lift"],["minute","sec"],["minute","second"]];
const loose=x=>norm(x).replace(/[^a-z0-9]/g,"");
function isSpellingVariant(a,b){
  if(loose(a)===loose(b))return true;
  const A=norm(a),B=norm(b);
  return SPELLING.some(([x,y])=>(A===x&&B===y)||(A===y&&B===x));
}
function maxHints(a){return a.replace(/[^a-z0-9]/gi,"").length>3?2:1}
function hint(){
  const a=cur.card.answer;
  if(cur.hints>=maxHints(a))return;
  cur.hints++;
  const shown=a.slice(0,cur.hints);
  const rest=a.slice(cur.hints).replace(/[a-z0-9]/gi,"_");
  const h=document.getElementById("hint"); h.hidden=false;
  h.innerHTML=`<small>힌트</small>${esc(shown+rest)}`;
  setPlaceholder(shown.replace(/[^A-Za-z0-9].*$/,""));
  if(!isBox(document.activeElement))ansEl().focus({preventScroll:true});
  document.getElementById("revealBtn").hidden=false;
  const hb=document.getElementById("hintBtn");
  if(cur.hints>=maxHints(a)){hb.disabled=true;hb.textContent="힌트 다 씀"}else hb.textContent="한 글자 더";
}
// 입력할 때마다 자동 확인: 칸에 쓴 단어들만 이어 붙여 비교해요(띄어쓰기·하이픈·대소문자 무시).
/* 키보드 받아쓰기로 문장 일부("I'll stick around")나 전체를 말해도 정답을 찾아요.
   정답 앞뒤에 붙은 단어가 모두 이 문장에 원래 있는 단어일 때만 인정해서, 후보를 여러 개 말하는 건 정답이 안 돼요. */
function spokenMatch(targetsL){
  const words=norm(ansEl().value).split(/[^a-z0-9']+/).map(loose).filter(Boolean);
  if(words.length<2)return -1;
  const [pre,post]=cur.card.en.split("___");
  const ctx=new Set((pre+" "+post).toLowerCase().split(/[^a-z0-9']+/).map(loose).filter(Boolean));
  // 줄임말을 풀어 말해도 되도록 (I'll → I will 등) 흔한 기능어는 허용해요
  ["i","will","you","we","they","he","she","it","is","am","are","not","do","does","the","a","an","to","would","have","has","let","us","um","uh","so","okay"].forEach(w=>ctx.add(w));
  for(let i=0;i<words.length;i++)for(let j=i;j<words.length;j++){
    const k=targetsL.indexOf(words.slice(i,j+1).join(""));
    if(k<0)continue;
    const rest=[...words.slice(0,i),...words.slice(j+1)];
    if(rest.every(w=>ctx.has(w)))return k;
  }
  return -1;
}
function setTyped(ans){const w=segments(ans).filter(x=>x.word).map(x=>x.text);ansEl().value=w.length===boxLens.length?w.join(" "):ans;renderBoxes()}
function applyHit(hit){
  const all=[cur.card.answer,...cur.card.alts];
  if(hit>0){const typed=all[hit]; if(isSpellingVariant(typed,cur.card.answer))cur.variant=typed; else cur.alt=typed;}
  finish(cur.hints?"hinted":"clean");
}

/* ---------- 문장 말하기 모드 ----------
   문장 전체를 받아쓰기(키보드 마이크)나 타이핑으로 입력하면, 원래 문장과 단어 단위로 맞춰 봐요.
   정답 여부는 빈칸 단어로만 정하고, 문장 일치도는 참고로 보여 줘요. 줄임말(I'll ↔ I will)은 같은 것으로 봐요. */
const sentenceMode=()=>settings.answerMode==="sentence";
function applyMode(reset){
  const on=sentenceMode(), card=document.getElementById("card");
  card.classList.toggle("sentence-mode",on);
  document.getElementById("modeBtn").setAttribute("aria-pressed",String(on));
  document.getElementById("said").hidden=!on;
  document.getElementById("checkSentBtn").hidden=!on||cur.done;
  if(reset){ansEl().value="";cur.wasWrong=false;toggleWrong(false);document.getElementById("msg").textContent="";renderBoxes()}
  cur.sentDiff=null; renderSaid();
}
function expand(t){
  return norm(t).replace(/[’‘]/g,"'")
    .replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"can not").replace(/\bcannot\b/g,"can not").replace(/\blet's\b/g,"let us")
    .replace(/n't\b/g," not").replace(/'re\b/g," are").replace(/'m\b/g," am").replace(/'ll\b/g," will").replace(/'ve\b/g," have").replace(/'d\b/g," would")
    .replace(/\b(it|that|what|there|he|she|who|here)'s\b/g,"$1 is");
}
const toks=t=>expand(t).split(/[^a-z0-9']+/).map(w=>w.replace(/'/g,"")).filter(Boolean);
const tokEq=(a,b)=>a===b||isSpellingVariant(a,b);
// 두 단어가 얼마나 비슷한지 (0~1, 편집 거리 기준)
function similar(a,b){
  if(a===b)return 1; const m=a.length,n=b.length; if(!m||!n)return 0;
  let prev=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){const curr=[i];for(let j=1;j<=n;j++)curr[j]=Math.min(prev[j]+1,curr[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=curr}
  return 1-prev[n]/Math.max(m,n);
}
function alignTokens(T,S){
  const n=T.length,m=S.length,d=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=tokEq(T[i],S[j])?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  // ops: 말한 단어 순서대로 맞음(ok) / 다르게 말함(sub) / 빠뜨림(miss) / 문장에 없는 말(extra)
  const hit=new Array(n).fill(false), raw=[]; let i=0,j=0;
  while(i<n&&j<m){
    if(tokEq(T[i],S[j])){hit[i]=true;raw.push({t:"ok",i,s:S[j]});i++;j++}
    else if(d[i+1][j]>=d[i][j+1]){raw.push({t:"miss",i});i++}
    else{raw.push({t:"extra",s:S[j]});j++}
  }
  while(i<n)raw.push({t:"miss",i:i++});
  while(j<m)raw.push({t:"extra",s:S[j++]});
  // 맞은 단어 사이 구간마다, 다르게 말한 단어를 그 구간에서 가장 비슷한 원래 단어와 짝지어요
  // (예: "embrassed"만 말하면 문장 끝 단어가 아니라 빈칸 단어 자리와 짝지어요)
  const ops=[]; let gap=[];
  const flush=()=>{
    const M=gap.filter(o=>o.t==="miss"), E=gap.filter(o=>o.t==="extra"), pair=new Map(); let from=0;
    for(const e of E){
      let best=-1,bs=-1;
      for(let q=from;q<M.length;q++){const sc=similar(e.s,T[M[q].i])+(M.length===E.length&&q===E.indexOf(e)?0.2:0);if(sc>bs){bs=sc;best=q}}
      if(best>=0&&(bs>=0.35||M.length===E.length)){pair.set(M[best].i,e.s);from=best+1;e.used=true}
    }
    for(const m of M)ops.push(pair.has(m.i)?{t:"sub",i:m.i,s:pair.get(m.i)}:m);
    for(const e of E)if(!e.used)ops.push(e);
    gap=[];
  };
  for(const o of raw){if(o.t==="ok"){flush();ops.push(o)}else gap.push(o)}
  flush();
  return {hit,ops};
}
function gradeSentence(){
  const [pre,post]=cur.card.en.split("___"), S=toks(ansEl().value);
  const all=[cur.card.answer,...cur.card.alts];
  let best=null;
  all.forEach((a,k)=>{
    const T=toks(pre+a+post), aS=toks(pre).length, aL=Math.max(1,toks(pre+a).length-aS);
    const {hit,ops}=alignTokens(T,S), ok=hit.slice(aS,aS+aL).every(Boolean), acc=hit.filter(Boolean).length/T.length;
    const r={k,T,hit,ops,aS,aL,ok,acc,said:S.length};
    if(!best||(r.ok&&!best.ok)||(r.ok===best.ok&&r.acc>best.acc))best=r;
  });
  return best;
}
// 다시 말하기 전에: 지난 시도는 기록으로 남기고, 이번 문장은 빈 상태에서 새로 인식해요
function resetAttempt(){
  ansEl().value=""; cur.sentDiff=null; cur.lastJudged=null; cur.resetNext=false; cur.wasWrong=false;
  clearTimeout(cur.autoT); toggleWrong(false);
  const m=document.getElementById("msg"); if(m)m.textContent="";
  renderSaid();
}
function mergeCover(r){
  cur.cover=cur.cover||{};
  const prev=cur.cover[r.k]||new Array(r.T.length).fill(false);
  cur.cover[r.k]=prev.map((v,i)=>v||r.hit[i]);
  const c=cur.cover[r.k]; return c.filter(Boolean).length/c.length;
}
function checkSentence(pressed){
  if(cur.done||!sentenceMode())return;
  clearTimeout(cur.autoT);
  const msg=document.getElementById("msg"), r=gradeSentence();
  cur.sentAll=[cur.card.answer,...cur.card.alts]; cur.sentHit=r.k;
  if(!r.said){if(pressed)msg.textContent="문장 전체를 말하거나 입력해 주세요.";return}
  const complete=r.said>=Math.max(2,r.T.length-1);
  // 정답 여부는 빈칸 단어로만 정해요. 나머지 문장을 얼마나 맞게 읽었는지는 참고용으로만 보여 줘요.
  if(!pressed&&!complete&&!r.ok)return;   // 아직 말하는 중이면 기다려요
  cur.sentDiff=r; cur.sentAcc=mergeCover(r); cur.lastJudged=toks(ansEl().value).join(" ");
  if(r.ok){renderSaid();setTyped(cur.sentAll[r.k]);applyHit(r.k);return}
  // 틀린 시도는 기록해 두고, 다음에 말하거나 입력하면 새 문장으로 인식해요
  (cur.attempts=cur.attempts||[]).push({text:ansEl().value.trim(),ok:r.hit.filter(Boolean).length,n:r.T.length});
  cur.resetNext=true; renderSaid();
  if(!cur.wasWrong)cur.wrongs++; cur.wasWrong=true;
  toggleWrong(true); shakeSlots();
  msg.textContent=cur.hints?"빈칸 단어가 달라요. 다시 말하거나 정답을 확인하세요.":"빈칸 단어가 달라요. 다시 말하거나 힌트를 써 보세요.";
  document.getElementById("revealBtn").hidden=false;
}
// 지난 시도들: 무엇을 말했고 몇 단어가 맞았는지 한 줄씩 (빈칸 정답은 보여 주지 않아요)
function attemptsHTML(){
  const a=cur.attempts||[]; if(!a.length)return"";
  return `<ol class="tries">${a.map((t,i)=>`<li><b>${i+1}</b><span>${esc(t.text||"(빈 입력)")}</span><em>${t.ok}/${t.n}</em></li>`).join("")}</ol>`;
}
function renderSaid(){
  const box=document.getElementById("said"); if(!box||box.hidden)return;
  const r=cur.sentDiff, v=ansEl().value;
  if(r&&!cur.done&&toks(v).join(" ")!==cur.lastJudged){cur.sentDiff=null;return renderSaid()}
  if(r){
    // 정답을 확인하기 전에는 빈칸 자리의 정답 단어를 절대 보여 주지 않아요
    const isKey=i=>i!=null&&i>=r.aS&&i<r.aS+r.aL, hide=!cur.done;
    const show=w=>w==="i"?"I":w;
    const okN=r.hit.filter(Boolean).length;
    const chips=r.ops.map(o=>{
      if(o.t==="ok")return `<span class="tk ok${isKey(o.i)?" key":""}">${esc(show(o.s))}</span>`;
      if(o.t==="extra")return `<span class="tk extra" title="문장에 없는 말">${esc(show(o.s))}</span>`;
      if(o.t==="sub"){
        const exp=isKey(o.i)&&hide?"":`<small>→ ${esc(show(r.T[o.i]))}</small>`;
        return `<span class="tk sub${isKey(o.i)?" key":""}">${esc(show(o.s))}${exp}</span>`;
      }
      return isKey(o.i)&&hide?`<span class="tk miss key">빈칸</span>`:`<span class="tk miss">${esc(show(r.T[o.i]))}</span>`;
    }).join("");
    const keyMsg=r.ok?"빈칸 단어 맞음":"빈칸 단어 다름";
    box.innerHTML=`<span class="said-label">말한 문장 확인 · ${r.T.length}단어 중 ${okN}개 맞음 · <b class="${r.ok?"good":"bad"}">${keyMsg}</b></span>
      <span class="said-chips">${chips}</span>
      <span class="said-legend"><span class="tk ok">맞음</span><span class="tk sub">다르게 말함</span><span class="tk miss">빠뜨림</span><span class="tk extra">없는 말</span><span class="lg-key">밑줄은 빈칸 자리</span></span>`;
  }else if(v.trim()){
    box.innerHTML=`<span class="said-label">말한 문장</span><span class="said-text">${esc(v)}</span>`;
  }else{
    const tries=(cur.attempts||[]).length;
    box.innerHTML=tries?`<span class="said-label">다시 말하기</span><span class="said-text muted">${listening?"듣는 중… 문장 전체를 다시 말해 보세요.":"다시 말하면 새 문장으로 인식해요. 빈칸 단어만 맞히면 정답이에요."}</span>`
      :`<span class="said-label">문장 모드</span><span class="said-text muted">${canMic?"말하기 버튼을 누르고":"키보드의 마이크를 눌러"} 문장 전체를 말하거나 입력하세요. 말을 멈추면 자동으로 확인해요.</span>`;
  }
}

function check(pressedEnter){
  if(cur.done)return;
  const msg=document.getElementById("msg");
  let v=typedLoose();
  const all=[cur.card.answer,...cur.card.alts], allL=all.map(loose);
  let hit=v?allL.indexOf(v):-1;
  if(hit<0){const k=spokenMatch(allL);if(k>=0){hit=k;v=allL[k]}}
  if(hit>=0){setTyped(all[hit]);applyHit(hit);return} // 대소문자·마침표 없이 깔끔하게 칸에 보여 줘요
  const minLen=Math.min(...allL.map(a=>a.length));
  const stillPossible=allL.some(a=>a.startsWith(v)&&a.length>v.length);
  const wrong=v.length>=minLen&&!stillPossible;
  if(wrong&&!cur.wasWrong)cur.wrongs++; // 틀린 상태로 바뀔 때마다 1회
  cur.wasWrong=wrong;
  toggleWrong(wrong);
  if(wrong){
    msg.textContent=cur.hints?"틀렸어요. 고쳐 쓰거나 정답을 확인하세요.":"틀렸어요. 고쳐 쓰거나 힌트를 써 보세요.";
    document.getElementById("revealBtn").hidden=false;
    if(pressedEnter)shakeSlots();
  }else{
    msg.textContent=pressedEnter&&!v?"빈칸에 들어갈 단어를 입력해 주세요.":"";
  }
}
function reveal(){fillBoxes(cur.card.answer);finish("revealed")}
/* ---------- 복습 주기 ----------
   결과를 다섯 단계로 나누고, 표현마다 '쉬움 계수(ease)'와 '복습 간격(ivl, 일)'을 따로 기억해요.
   빠르고 정확하게 맞힐수록 간격이 크게 늘고, 틀리거나 힌트를 쓰면 짧아져요. */
const GRADE={
  perfect:{label:"빠르게 정답",desc:"힌트·오답 없이 빠르게"},
  good:{label:"정답",desc:"힌트·오답 없이"},
  hard:{label:"어렵게 정답",desc:"오답 후 정답, 또는 오래 걸림"},
  hinted:{label:"힌트 사용",desc:"힌트를 보고 정답"},
  revealed:{label:"정답 확인",desc:"정답 보기"}
};
function gradeOf(result){
  if(result!=="clean")return result;
  const letters=loose(cur.card.answer).length;
  let fast=6+0.35*letters, slow=20+letters;     // 초 단위, 정답이 길수록 여유를 줘요
  if(cur.sentAcc!=null){const w=toks(cur.card.en.replace("___",cur.card.answer)).length;fast+=3+0.5*w;slow+=6+w} // 문장 모드는 말하는 시간만큼 더
  if(cur.wrongs>0||cur.secs>slow)return"hard";
  return cur.secs<=fast?"perfect":"good";
}
function schedule(result){
  const c=cur.card, item=cur.item, t=dayKey();
  cur.secs=Math.max(0,(performance.now()-cur.t0-cur.paused)/1000);
  cur.grade=gradeOf(result);
  if(item.retry)return; // 같은 날 재시도는 일정에 반영하지 않음
  log[t]=(log[t]||0)+1; markDirty("meta");
  const prev=progress[c.id]||{seen:0,firstSeen:t};
  const isNew=!progress[c.id];
  const pIvl=isNew?0:cardIvl(prev);
  // 이전에 힌트를 썼던 표현은 간격을 1일부터 다시 키워요
  const base=prev.hinted?1:pIvl;
  let ease=prev.ease||2.5, ivl;
  switch(cur.grade){
    case"perfect": ivl=isNew?7:Math.max(base+4,Math.round(base*ease*1.6)); ease+=0.15; break;
    case"good":    ivl=isNew?4:Math.max(base+2,Math.round(base*ease*1.3)); break;
    case"hard":    ivl=isNew?2:Math.max(2,Math.round(base*1.5));           ease-=0.15; break;
    case"hinted":  ivl=1; ease-=0.2; break;
    default:       ivl=1; ease-=0.3;
  }
  ease=Math.min(3.2,Math.max(1.3,ease));
  ivl=Math.min(180,ivl);
  if(ivl>=6)ivl+=Math.round(ivl*0.08*(Math.random()*2-1)); // 같은 날에 몰리지 않게 살짝 흩어요
  const st={...prev,seen:(prev.seen||0)+1,last:t,ease,ivl,due:addDays(ivl),
    hinted:cur.grade==="hinted"||cur.grade==="revealed",lastGrade:cur.grade,
    lastSecs:Math.round(cur.secs*10)/10,lastWrongs:cur.wrongs};
  delete st.box;
  setState(c.id,st);
}
function finish(result){
  clearTimeout(cur.autoT);
  ["checkSentBtn"].forEach(id=>{const b=document.getElementById(id);if(b)b.hidden=true});
  cur.done=true;
  schedule(result); renderBadge();
  if(!cur.item.retry)session.results[result]++;
  if(result==="revealed"&&!cur.item.retry)session.queue.push({id:cur.card.id,retry:true,isNew:false});
  cur.shown=ansEl().value; placeholderTxt=""; renderBoxes();
  setSlots(result==="revealed"?"revealed":"ok");
  document.getElementById("msg").textContent="";
  document.getElementById("hintBtn").hidden=true;
  document.getElementById("revealBtn").hidden=true;
  document.querySelector("#card .actions").hidden=true;
  const nextLabel=session.pos+1<session.queue.length?"다음":"결과 보기";
  const full=cur.alt?cur.card.en.replace("___",cur.alt):fullSentence(cur.card);
  const head=result==="clean"?(cur.grade==="perfect"?"빠르게 정답이에요":cur.grade==="hard"?"맞혔어요 · 조금 헤맸어요":"정답이에요")
    :result==="hinted"?"맞혔어요 · 힌트 사용":"정답을 확인했어요";
  const st=progress[cur.card.id];
  const sub=cur.item.retry?"이번 세션에서 한 번 더 연습했어요."
    :result==="revealed"?"이번 세션 끝에 한 번 더, 그리고 내일 다시 나와요."
    :`다음 복습 ${laterLabel(st.due)}`;
  const measure=cur.item.retry?"":`<p class="measure"><span class="pill g-${cur.grade}">${GRADE[cur.grade].label}</span>${cur.secs.toFixed(1)}초 · 오답 ${cur.wrongs}회${cur.hints?` · 힌트 ${cur.hints}글자`:""}${cur.sentAcc!=null&&result!=="revealed"?` · 문장 ${Math.round(cur.sentAcc*100)}%`:""}</p>`;
  document.getElementById("fb").innerHTML=`
    <div class="feedback ${result}">
      <div class="fb-head"><h3>${head}</h3><button class="btn primary next" id="fbNext">${nextLabel}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button></div>
      <p class="full">${esc(full)}</p>
      ${measure}
      ${cur.variant?`<p class="small">이렇게 써도 정답이에요. 기본 표기는 <b>${esc(cur.card.answer)}</b></p>`:""}
      ${cur.alt?`<div class="bonus" id="bonusBox"></div>`:""}
      <div class="fb-rest" id="fbRest" ${cur.alt?"hidden":""}>
        <p>${esc(cur.card.note)}</p>
        <div class="row" style="justify-content:space-between"><span class="small">${sub}</span>
        ${canSpeak?`<button class="btn ghost" id="say" aria-label="문장 듣기">${SPEAK_ICON}듣기</button>`:""}</div>
      </div>
    </div>`;
  if(cur.alt)startBonus();
  const say=document.getElementById("say"); if(say){keepFocus(say);say.onclick=()=>speak(full)}
  const mbx=document.getElementById("micBtn"); if(mbx)mbx.hidden=!cur.alt;
  if(listening)releaseListening();
  if(settings.autoSpeak&&canSpeak){
    if(canMic&&(rec||Date.now()-micEndedAt<1500)){
      if(!settings.micQuiet)afterMic(()=>{if(cur&&cur.done&&!listening)speak(full)}); // 마이크가 완전히 꺼진 뒤에 읽어요
    }else if(sentenceMode()&&isBox(document.activeElement)){
      // 받아쓰기 마이크가 켜져 있으면 iOS가 소리를 통화 모드처럼 작게 내요.
      // 그래서 문장 모드에서는 키보드를 내려 마이크를 끈 뒤, 잠깐 기다렸다가 읽어요.
      ansEl().blur();
      setTimeout(()=>speak(full),650);
    }else speak(full);
  }
  const nb=document.getElementById("fbNext");
  keepFocus(nb); nb.onclick=next;
  if(!isBox(document.activeElement))nb.focus({preventScroll:true});
  showFeedback();
}
// 키보드에 가리지 않도록, 보이는 화면(visualViewport) 기준으로 설명 박스와 다음 버튼을 끌어올려요
function showFeedback(){
  const target=document.getElementById("fb");
  const run=()=>{
    const vv=window.visualViewport, bottom=vv?vv.height:window.innerHeight;
    const ko=document.getElementById("qKo"); if(!target.isConnected||!ko)return;
    const r=target.getBoundingClientRect(), top=ko.getBoundingClientRect().top;
    const need=r.bottom+12-bottom;

  requestAnimationFrame(run); setTimeout(run,250);

function checkBonus(){
  const msg=document.getElementById("bonusMsg");
  const v=typedLoose(), a=loose(cur.card.answer);
  if(v===a||spokenMatch([a])===0){endBonus("solved");return}
  const isAlt=cur.card.alts.some(x=>loose(x)===v);
  const wrong=!!v&&(isAlt||(v.length>=a.length&&!a.startsWith(v)));
  toggleWrong(wrong);
  if(msg)msg.textContent=isAlt?"이것도 맞는 표현이지만, 찾는 건 다른 표현이에요.":wrong?"아직 아니에요.":"";

function backupCode(){
  const json=JSON.stringify({v:1,progress,settings,log});
  return "TT1:"+btoa(unescape(encodeURIComponent(json)));
}
function importBackup(code){
  const m=String(code).trim().match(/^TT1:([A-Za-z0-9+/=\s]+)$/);
  if(!m)throw new Error("format");
  const d=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/\s+/g,"")))));
  let n=0;
  for(const [id,v] of Object.entries(d.progress||{})){
    if(!BY_ID[id])continue; const c=progress[id];
    if(!c||(v.updated||0)>(c.updated||0)){progress[id]=v;markDirty("p_"+BY_ID[id].line);n++}
  }
  for(const [k,x] of Object.entries(d.log||{}))log[k]=Math.max(log[k]||0,x);
  if(d.settings&&(d.settings.updated||0)>(settings.updated||0))settings=Object.assign({},settings,d.settings);
  normalizeSettings(); markDirty("meta"); saveLocal();
  return n;
}
function wireBackup(){
  const area=document.getElementById("bkArea"), ta=document.getElementById("bkText"), msg=document.getElementById("bkMsg"), load=document.getElementById("bkLoad");
  document.getElementById("bkCopy").onclick=()=>{
    const code=backupCode();
    const showBox=()=>{area.hidden=false;load.hidden=true;ta.value=code;ta.focus();ta.select();msg.textContent="복사가 안 되면 위 코드를 길게 눌러 전체 선택 후 복사하세요."};
    try{navigator.clipboard.writeText(code).then(()=>{area.hidden=true;document.getElementById("bkCopy").textContent="복사했어요 ✓";setTimeout(()=>{const b=document.getElementById("bkCopy");if(b)b.textContent="백업 코드 복사"},2500)},showBox)}catch(e){showBox()}
  };
  document.getElementById("bkOpen").onclick=()=>{area.hidden=false;load.hidden=false;ta.value="";msg.textContent="";ta.focus()};
  load.onclick=()=>{
    try{const n=importBackup(ta.value);msg.textContent=`불러왔어요. 표현 ${n}개의 기록을 합쳤어요.`;setTimeout(()=>go("stats"),1200)}
    catch(e){msg.textContent="백업 코드를 읽지 못했어요. TT1:로 시작하는 코드 전체를 붙여 넣었는지 확인해 주세요."}
  };
}
